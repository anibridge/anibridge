name: CI

on:
    pull_request:
    push:
        branches: [main, develop, experimental]
        tags: ["v*"]
    workflow_dispatch:
        inputs:
            ref:
                description: Git ref (branch/tag/SHA) to test/build
                required: true

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}
    UV_VERSION: "0.13.4"

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-26.04
        timeout-minutes: 10

        permissions:
            contents: read

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.ref }}

            - name: Install uv
              uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
              with:
                  version: ${{ env.UV_VERSION }}

            - name: Set up pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
              with:
                  package_json_file: frontend/package.json

            - name: Set up Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 26.12.1
                  cache: pnpm
                  cache-dependency-path: frontend/pnpm-lock.yaml

            - name: Sync dependencies
              run: uv sync --group dev --frozen && pnpm install -C frontend --frozen-lockfile

            - name: Run linters
              run: uv run ab-lint

    tests:
        name: Tests
        runs-on: ubuntu-26.04
        timeout-minutes: 10

        permissions:
            contents: read

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.ref }}

            - name: Install uv
              uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
              with:
                  version: ${{ env.UV_VERSION }}

            - name: Set up pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
              with:
                  package_json_file: frontend/package.json

            - name: Set up Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 26.12.1
                  cache: pnpm
                  cache-dependency-path: frontend/pnpm-lock.yaml

            - name: Sync dependencies
              run: uv sync --group dev --frozen && pnpm install -C frontend --frozen-lockfile

            - name: Run test suites
              run: uv run ab-test

    publish:
        name: Build and Publish Docker Image
        needs: [lint, tests]
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/develop') || startsWith(github.ref, 'refs/heads/experimental') || startsWith(github.ref, 'refs/tags/v'))
        runs-on: ubuntu-26.04

        permissions:
            contents: read
            packages: write
            id-token: write

        steps:
            - name: Set lowercase repository name
              run: |
                  echo "IMAGE_NAME_LC=$(echo ${{ github.event.repository.name }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set version variables
              run: |
                  echo "IS_STABLE=${{ github.ref_type == 'tag' && !contains(github.ref, '-alpha.') && !contains(github.ref, '-beta.') }}" >> $GITHUB_ENV
                  echo "IS_ALPHA=${{ github.ref_type == 'tag' && contains(github.ref, '-alpha.') }}" >> $GITHUB_ENV
                  echo "IS_BETA=${{ github.ref_type == 'tag' && contains(github.ref, '-beta.') }}" >> $GITHUB_ENV
                  echo "IS_PRERELEASE=${{ github.ref_type == 'tag' && (contains(github.ref, '-alpha.') || contains(github.ref, '-beta.')) }}" >> $GITHUB_ENV

            - name: Set up QEMU
              uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - name: Log into Registry
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract Docker metadata
              id: meta
              uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  flavor: |
                      latest=false
                  tags: |
                      # X.Y.Z, X.Y, X
                      type=semver,pattern={{version}},enable=${{ env.IS_STABLE }}
                      type=semver,pattern={{major}}.{{minor}},enable=${{ env.IS_STABLE }}
                      type=semver,pattern={{major}},enable=${{ env.IS_STABLE }}
                      # vX.Y.Z, vX.Y, vX
                      type=semver,pattern=v{{version}},enable=${{ env.IS_STABLE }}
                      type=semver,pattern=v{{major}}.{{minor}},enable=${{ env.IS_STABLE }}
                      type=semver,pattern=v{{major}},enable=${{ env.IS_STABLE }}
                      # X.Y.Z-alpha.W, X.Y.Z-beta.W
                      type=semver,pattern={{version}},enable=${{ env.IS_PRERELEASE }}
                      # vX.Y.Z-alpha.W, vX.Y.Z-beta.W
                      type=semver,pattern={{raw}},enable=${{ env.IS_PRERELEASE }}
                      # alpha, beta
                      type=raw,value=alpha,enable=${{ env.IS_ALPHA }}
                      type=raw,value=beta,enable=${{ env.IS_BETA }}
                      # main, develop, experimental
                      type=ref,event=branch
                      # latest
                      type=raw,value=latest,enable=${{ env.IS_STABLE }}

            - name: Build and push Docker image
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: |
                      ${{ steps.meta.outputs.labels }}
                      org.opencontainers.image.description="The smart way to keep your anime lists perfectly synchronized."
                  annotations: |
                      org.opencontainers.image.description="The smart way to keep your anime lists perfectly synchronized."
                  provenance: false
                  sbom: false
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Delete untagged packages
              uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
              continue-on-error: true
              with:
                  delete-untagged: true
                  delete-ghost-images: true
                  delete-orphaned-images: true
                  validate: true
                  package: ${{ env.IMAGE_NAME_LC }}
