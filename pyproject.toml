[project]
name = "anibridge"
version = "2.1.4"
description = "Sync what you watch, wherever you watch."
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.14"

authors = [
    { name = "Elias Benbourenane", email = "eliasbenbourenane@gmail.com" },
]
maintainers = [
    { name = "Elias Benbourenane", email = "eliasbenbourenane@gmail.com" },
]

keywords = [
    "anibridge",
    "anime",
    "scrobble",
    "synchronization",
    "monitoring",
    "plex",
    "jellyfin",
    "emby",
    "anilist",
    "myanimelist",
    "trakt",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]

dependencies = [
    "aiohttp>=3.14.1",
    "alembic>=1.18.5",
    "anibridge-anilist-provider>=0.2.2",
    "anibridge-emby-provider>=0.2.3",
    "anibridge-jellyfin-provider>=0.2.3",
    "anibridge-mal-provider>=0.2.2",
    "anibridge-plex-provider>=0.2.2",
    "anibridge-provider-base>=0.1.0a3",
    "anibridge-simkl-provider>=0.1.0",
    "anibridge-trakt-provider>=0.2.0",
    "anibridge-utils>=0.2.2,<1.0.0",
    "bcrypt>=5.0.0",
    "colorama>=0.4.6",
    "croniter>=6.2.3",
    "litestar>=2.24.0",
    "msgspec>=0.21.1",
    "psutil>=7.2.2",
    "pydantic-settings>=2.14.2",
    "pydantic>=2.13.4",
    "pyparsing>=3.3.2",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.5",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.51.0",
]

[project.scripts]
ab-build = "anibridge.scripts.dev:build"
ab-clean = "anibridge.scripts.dev:clean"
ab-deps-install = "anibridge.scripts.dev:deps_install"
ab-deps-upgrade = "anibridge.scripts.dev:deps_upgrade"
ab-dev = "anibridge.scripts.dev:dev"
ab-format = "anibridge.scripts.dev:format_"
ab-lint = "anibridge.scripts.dev:lint"
ab-meta-setup = "anibridge.scripts.dev:meta_setup"
ab-start = "anibridge.scripts.dev:start"
ab-test = "anibridge.scripts.dev:test"

[project.urls]
Documentation = "https://anibridge.eliasbenb.dev"
Homepage = "https://anibridge.eliasbenb.dev"
Issues = "https://github.com/anibridge/anibridge/issues"
Source = "https://github.com/anibridge/anibridge"

[tool.ruff]
indent-width = 4
line-length = 88

[tool.ruff.format]
docstring-code-format = true
indent-style = "space"
quote-style = "double"

[tool.ruff.lint]
select = [
    "A",
    "ASYNC",
    "B",
    "C4",
    "D",
    "E",
    "F",
    "FURB",
    "G",
    "I",
    "N",
    "PERF",
    "PLC",
    "PLE",
    "RUF",
    "SIM",
    "UP",
    "W",
]

[tool.ruff.lint.per-file-ignores]
"alembic/**/*.py" = ["ALL"]
"packages/**/*.py" = ["I001"]
"tests/**/*.py" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=src --import-mode=importlib"
filterwarnings = []

[tool.uv]
python-preference = "only-managed"

[tool.uv.build-backend]
module-name = "anibridge"
namespace = true

[tool.uv.sources]
anibridge-anilist-provider = { git = "https://github.com/anibridge/anibridge-anilist-provider.git", tag = "main" }
anibridge-emby-provider = { git = "https://github.com/anibridge/anibridge-emby-provider.git", tag = "main" }
anibridge-jellyfin-provider = { git = "https://github.com/anibridge/anibridge-jellyfin-provider.git", tag = "main" }
anibridge-mal-provider = { git = "https://github.com/anibridge/anibridge-mal-provider.git", tag = "main" }
anibridge-plex-provider = { git = "https://github.com/anibridge/anibridge-plex-provider.git", tag = "main" }
anibridge-provider-base = { git = "https://github.com/anibridge/anibridge-provider-base.git", tag = "main" }
anibridge-simkl-provider = { git = "https://github.com/anibridge/anibridge-simkl-provider.git", tag = "main" }
anibridge-trakt-provider = { git = "https://github.com/anibridge/anibridge-trakt-provider.git", tag = "main" }
anibridge-utils = { git = "https://github.com/anibridge/anibridge-utils.git", tag = "main" }

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "memray>=1.19.3",
    "py-spy>=0.4.2",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest>=9.1.1",
    "ruff>=0.15.21",
    "ty>=0.0.57",
]
